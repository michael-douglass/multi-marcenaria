<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARBO Movelaria — Sistema Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#150c09;font-family:'Raleway',sans-serif;color:#f4e4d6;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(90,45,10,.45) 0,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(60,25,5,.35) 0,transparent 55%),radial-gradient(ellipse at 50% 0%,rgba(212,168,83,.04) 0,transparent 60%);pointer-events:none;z-index:0}
#app{position:relative;z-index:2;min-height:100vh}
.glass-card{background:rgba(36,16,8,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(212,168,83,.22);border-radius:10px}
.glass-input{background:rgba(15,7,3,.65);border:1px solid rgba(212,168,83,.28);border-radius:8px;color:#f4e4d6;font-family:'Raleway',sans-serif;font-size:.875rem;outline:none;width:100%;padding:.5rem .75rem;transition:border-color .2s,box-shadow .2s}
.glass-input:focus{border-color:#d4a853;box-shadow:0 0 0 3px rgba(212,168,83,.12)}
.glass-input option,.glass-input optgroup{background:#1a0b05;color:#f4e4d6}
textarea.glass-input{resize:vertical;min-height:72px}
.btn-gold{background:linear-gradient(135deg,#d4a853,#c8973e);color:#150c09;font-family:'Raleway',sans-serif;font-weight:700;border:none;border-radius:8px;padding:.5rem 1.25rem;cursor:pointer;transition:all .2s;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn-gold:hover{background:linear-gradient(135deg,#ddb55f,#d4a853);box-shadow:0 4px 20px rgba(212,168,83,.35);transform:translateY(-1px)}
.btn-gold:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;color:#d4a853;font-family:'Raleway',sans-serif;font-weight:600;border:1px solid rgba(212,168,83,.45);border-radius:8px;padding:.5rem 1.1rem;cursor:pointer;transition:all .2s;font-size:.8rem;white-space:nowrap}
.btn-outline:hover{background:rgba(212,168,83,.1);border-color:#d4a853}
.btn-sm{padding:.3rem .75rem;font-size:.75rem}
.btn-danger{background:rgba(220,38,38,.12);color:#f87171;font-family:'Raleway',sans-serif;font-weight:600;border:1px solid rgba(220,38,38,.38);border-radius:8px;padding:.5rem 1.1rem;cursor:pointer;transition:all .2s;font-size:.8rem;white-space:nowrap}
.btn-danger:hover{background:rgba(220,38,38,.22);border-color:rgba(220,38,38,.6)}
.btn-success{background:rgba(34,197,94,.12);color:#4ade80;font-family:'Raleway',sans-serif;font-weight:600;border:1px solid rgba(34,197,94,.38);border-radius:8px;padding:.5rem 1.1rem;cursor:pointer;transition:all .2s;font-size:.8rem;white-space:nowrap}
.btn-success:hover{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.6)}
.sidebar-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;cursor:pointer;transition:all .2s;color:#a07c65;font-size:.83rem;font-weight:500;position:relative;user-select:none}
.sidebar-item:hover{background:rgba(212,168,83,.08);color:#f4e4d6}
.sidebar-item.active{background:linear-gradient(90deg,rgba(212,168,83,.18),rgba(212,168,83,.04));color:#d4a853}
.sidebar-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:65%;background:#d4a853;border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(212,168,83,.55)}
.section-label{font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a6a55}
.badge{display:inline-flex;align-items:center;padding:.18rem .55rem;border-radius:9999px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.4}
.badge-gold{background:rgba(212,168,83,.14);color:#d4a853;border:1px solid rgba(212,168,83,.38)}
.badge-green{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.32)}
.badge-red{background:rgba(220,38,38,.12);color:#f87171;border:1px solid rgba(220,38,38,.32)}
.badge-amber{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.32)}
.badge-blue{background:rgba(96,165,250,.1);color:#93c5fd;border:1px solid rgba(96,165,250,.28)}
.table-row{border-bottom:1px solid rgba(212,168,83,.09);transition:background .15s}
.table-row:hover{background:rgba(212,168,83,.045)}
.modal-overlay{position:fixed;inset:0;background:rgba(8,3,1,.88);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:rgba(22,9,4,.97);border:1px solid rgba(212,168,83,.32);border-radius:14px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.8),inset 0 1px 0 rgba(212,168,83,.1);scrollbar-width:thin;scrollbar-color:rgba(212,168,83,.25) transparent}
.modal-box::-webkit-scrollbar{width:4px}
.modal-box::-webkit-scrollbar-thumb{background:rgba(212,168,83,.25);border-radius:2px}
.divider-gold{height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.35),transparent);margin:.75rem 0}
.scrollable{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(212,168,83,.2) transparent}
.scrollable::-webkit-scrollbar{width:4px}
.scrollable::-webkit-scrollbar-thumb{background:rgba(212,168,83,.2);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp .28s ease-out forwards}
.kpi-card{position:relative;overflow:hidden;border-radius:12px;padding:1.4rem 1.5rem;background:rgba(30,13,6,.88);backdrop-filter:blur(18px)}
.kpi-card::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

/* ─── SVG ICONS ─── */
const icons={
  menu:<><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></>,
  x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  dashboard:<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
  users:<><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
  truck:<><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,
  box:<><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
  clipboard:<><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></>,
  check:<><path d="M20 6L9 17l-5-5"/></>,
  dollar:<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></>,
  trendUp:<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
  trendDown:<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>,
  clock:<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  receipt:<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></>,
  eye:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
  plus:<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
  trash:<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></>,
  edit:<><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></>,
  shield:<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
  activity:<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></>,
  arrowRight:<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
};
const Ic=({n,s=16,c=''})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`inline-block flex-shrink-0 ${c}`}>{icons[n]||null}</svg>
);

/* ─── UTILITIES ─── */
const fmtCur=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDate=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
const today=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const addDays=(s,d)=>{if(!s)return s;const[y,m,dy]=s.split('-').map(Number);const dt=new Date(y,m-1,dy);dt.setDate(dt.getDate()+d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const isOver=s=>s&&s<today();
const uid=()=>Date.now()+Math.random();

/* ─── SEED DATA ─── */
const SUPPLIERS=[
  {id:1,name:'MDF Distribuidora Ltda',cnpj:'12.345.678/0001-90',phone:'(11) 98765-4321',email:'vendas@mdfdist.com.br'},
  {id:2,name:'Ferragens Premium S.A.',cnpj:'98.765.432/0001-10',phone:'(11) 91234-5678',email:'contato@ferragenspremium.com'},
  {id:3,name:'Lacas & Vernizes do Brasil',cnpj:'45.678.901/0001-23',phone:'(21) 99876-5432',email:'pedidos@lacasvernizes.com.br'},
];
const PRODUCTS=[
  {id:1,supplierId:1,description:'Chapa MDF Canela 15mm',unit:'m²',specs:'MDF E1 Canela 15mm 2,75×1,84m',price:89.90},
  {id:2,supplierId:2,description:'Dobradiça Oculta 110°',unit:'unidade',specs:'Blum Clip Top 110° c/ amortecedor',price:18.50},
  {id:3,supplierId:2,description:'Corrediça Soft-Close 450mm',unit:'par',specs:'Grass Nova Pro Scala 40kg',price:72.00},
  {id:4,supplierId:3,description:'Verniz Mogno Acetinado',unit:'litros',specs:'Suvinil Verniz Mogno 900ml',price:45.80},
  {id:5,supplierId:1,description:'Parafuso Confirmat 7×50',unit:'kg',specs:'Cabeça Reta Zincado 7×50mm',price:12.30},
];
const ORDERS=[
  {id:1,supplierId:1,status:'Aguardando Aprovação',date:'2026-05-20',items:[{productId:1,quantity:10,unitPrice:89.90,total:899.00},{productId:5,quantity:2,unitPrice:12.30,total:24.60}],total:923.60},
  {id:2,supplierId:2,status:'Aprovado',date:'2026-05-10',items:[{productId:2,quantity:20,unitPrice:18.50,total:370.00},{productId:3,quantity:5,unitPrice:72.00,total:360.00}],total:730.00},
];
const CLIENTS=[
  {id:1,name:'João Carlos Silva',address:'Rua das Acácias, 123 – Vila Nova, SP',phone:'(11) 99876-5432',cpf:'123.456.789-00'},
  {id:2,name:'Maria Aparecida Santos',address:'Av. Paulista, 1000 – Bela Vista, SP',phone:'(11) 98765-1234',cpf:'987.654.321-00'},
  {id:3,name:'Pedro Henrique Oliveira',address:'Rua dos Ipês, 456 – Jardim Primavera, SP',phone:'(11) 97654-3210',cpf:'456.789.123-00'},
];
const PAYABLES=[
  {id:1,orderId:2,supplierId:2,supplierName:'Ferragens Premium S.A.',total:730,installment:1,totalInstallments:3,value:243.33,dueDate:'2026-05-10',status:'Pago',paidAt:'2026-05-10'},
  {id:2,orderId:2,supplierId:2,supplierName:'Ferragens Premium S.A.',total:730,installment:2,totalInstallments:3,value:243.33,dueDate:'2026-06-09',status:'Pendente'},
  {id:3,orderId:2,supplierId:2,supplierName:'Ferragens Premium S.A.',total:730,installment:3,totalInstallments:3,value:243.34,dueDate:'2026-07-09',status:'Pendente'},
];
const RECEIVABLES=[
  {id:1,clientId:1,clientName:'João Carlos Silva',total:4500,installment:1,totalInstallments:4,value:1125,dueDate:'2026-04-20',paymentMethod:'Pix',status:'Recebido'},
  {id:2,clientId:1,clientName:'João Carlos Silva',total:4500,installment:2,totalInstallments:4,value:1125,dueDate:'2026-05-20',paymentMethod:'Pix',status:'Recebido'},
  {id:3,clientId:1,clientName:'João Carlos Silva',total:4500,installment:3,totalInstallments:4,value:1125,dueDate:'2026-06-20',paymentMethod:'Pix',status:'Pendente'},
  {id:4,clientId:1,clientName:'João Carlos Silva',total:4500,installment:4,totalInstallments:4,value:1125,dueDate:'2026-07-20',paymentMethod:'Pix',status:'Pendente'},
  {id:5,clientId:2,clientName:'Maria Aparecida Santos',total:2800,installment:1,totalInstallments:2,value:1400,dueDate:'2026-04-15',paymentMethod:'Cheque',status:'Recebido'},
  {id:6,clientId:2,clientName:'Maria Aparecida Santos',total:2800,installment:2,totalInstallments:2,value:1400,dueDate:'2026-06-15',paymentMethod:'Cheque',status:'Pendente'},
];

/* ─── SMALL COMPONENTS ─── */
const Logo=({full=true})=>(
  <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
    <svg width="38" height="38" viewBox="0 0 80 80">
      <rect x="40" y="4" width="51" height="51" rx="5" transform="rotate(45 40 40)" fill="#c9a07b"/>
      <text x="40" y="48" textAnchor="middle" fill="white" fontSize="34" fontFamily="Georgia,serif" fontWeight="bold" letterSpacing="-1">G</text>
    </svg>
    {full&&<div>
      <div style={{fontFamily:"'Bebas Neue',cursive",fontSize:'1.35rem',color:'#f4e4d6',letterSpacing:'.1em',lineHeight:1}}>GARBO</div>
      <div style={{fontSize:'.6rem',color:'#c9a07b',letterSpacing:'.28em',textTransform:'uppercase',fontWeight:500,marginTop:'1px'}}>Movelaria</div>
    </div>}
  </div>
);

const Badge=({s})=>{
  const map={
    'Aguardando Aprovação':'badge badge-gold',
    'Aprovado':'badge badge-green',
    'Recusado':'badge badge-red',
    'Pago':'badge badge-green',
    'Pendente':'badge badge-amber',
    'Recebido':'badge badge-green',
    'Vencido':'badge badge-red',
  };
  return<span className={map[s]||'badge badge-amber'}>{s}</span>;
};

const Field=({label,children,half})=>(
  <div style={{marginBottom:'1rem',flex:half?'1 1 45%':'1 1 100%'}}>
    <div className="section-label" style={{marginBottom:'6px'}}>{label}</div>
    {children}
  </div>
);

const Inp=props=><input className="glass-input" {...props}/>;
const Sel=({children,...props})=><select className="glass-input" {...props}>{children}</select>;

const Modal=({open,onClose,title,children,wide})=>{
  if(!open)return null;
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{maxWidth:wide?'780px':'560px'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'1.1rem 1.4rem',borderBottom:'1px solid rgba(212,168,83,.18)'}}>
          <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:'1.2rem',color:'#d4a853',letterSpacing:'.1em'}}>{title}</span>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'#a07c65',display:'flex',padding:'2px'}}><Ic n="x" s={18}/></button>
        </div>
        <div style={{padding:'1.4rem'}}>{children}</div>
      </div>
    </div>
  );
};

const Empty=({msg})=>(
  <div style={{padding:'3.5rem 1rem',textAlign:'center'}}>
    <div style={{fontSize:'2.4rem',marginBottom:'.75rem',opacity:.3}}>◈</div>
    <p style={{color:'#8a6a55',fontSize:'.85rem'}}>{msg}</p>
  </div>
);

const FilterBar=({options,value,onChange})=>(
  <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap',marginBottom:'1rem'}}>
    {options.map(f=>(
      <button key={f} onClick={()=>onChange(f)} style={{
        padding:'.3rem .9rem',borderRadius:'9999px',fontSize:'.75rem',fontWeight:600,
        border:value===f?'1px solid #d4a853':'1px solid rgba(212,168,83,.2)',
        background:value===f?'rgba(212,168,83,.14)':'transparent',
        color:value===f?'#d4a853':'#8a6a55',cursor:'pointer',transition:'all .15s',fontFamily:'Raleway,sans-serif',
      }}>{f}</button>
    ))}
  </div>
);

const Th=({children})=><th className="section-label" style={{textAlign:'left',padding:'.7rem 1rem',whiteSpace:'nowrap'}}>{children}</th>;
const Td=({children,gold,muted,green,red,center})=>(
  <td style={{padding:'.7rem 1rem',color:gold?'#d4a853':green?'#4ade80':red?'#f87171':muted?'#8a6a55':'#f4e4d6',fontSize:'.85rem',textAlign:center?'center':undefined}}>
    {children}
  </td>
);

/* ─── DASHBOARD ─── */
const Dashboard=({suppliers,products,orders,clients,payables,receivables})=>{
  const toReceive=receivables.filter(r=>r.status!=='Recebido').reduce((s,r)=>s+r.value,0);
  const toPay=payables.filter(p=>p.status!=='Pago').reduce((s,p)=>s+p.value,0);
  const pendOrd=orders.filter(o=>o.status==='Aguardando Aprovação').length;
  const overduePay=payables.filter(p=>p.status!=='Pago'&&isOver(p.dueDate)).reduce((s,p)=>s+p.value,0);
  const overdueRec=receivables.filter(r=>r.status!=='Recebido'&&isOver(r.dueDate)).reduce((s,r)=>s+r.value,0);

  const kpis=[
    {label:'A Receber',value:fmtCur(toReceive),color:'#4ade80',border:'rgba(74,222,128,.3)',icon:'trendUp',note:`${receivables.filter(r=>r.status!=='Recebido').length} parcelas pendentes`},
    {label:'A Pagar',value:fmtCur(toPay),color:'#fbbf24',border:'rgba(251,191,36,.3)',icon:'trendDown',note:`Vencido: ${fmtCur(overduePay)}`},
    {label:'Aguard. Aprovação',value:pendOrd,color:'#d4a853',border:'rgba(212,168,83,.35)',icon:'clock',note:'pedidos de compra'},
    {label:'Clientes Ativos',value:clients.length,color:'#93c5fd',border:'rgba(147,197,253,.28)',icon:'users',note:`${suppliers.length} fornecedores`},
  ];

  return(
    <div className="fade-in">
      <div style={{marginBottom:'1.75rem'}}>
        <h1 style={{fontFamily:"'Bebas Neue',cursive",fontSize:'2.2rem',color:'#d4a853',letterSpacing:'.08em',lineHeight:1}}>Dashboard</h1>
        <p className="section-label" style={{marginTop:'4px'}}>Visão geral · {new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem',marginBottom:'2rem'}}>
        {kpis.map((k,i)=>(
          <div key={i} className="kpi-card" style={{border:`1px solid ${k.border}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.5rem'}}>
              <div className="section-label">{k.label}</div>
              <div style={{color:k.color,opacity:.5}}><Ic n={k.icon} s={20}/></div>
            </div>
            <div style={{fontFamily:"'Bebas Neue',cursive",fontSize:'1.9rem',color:k.color,letterSpacing:'.04em',lineHeight:1}}>{k.value}</div>
            <div style={{fontSize:'.72rem',color:'#8a6a55',marginTop:'.35rem'}}>{k.note}</div>
          </div>
        ))}
      </div>

const PedidosCompra=({orders,setOrders,suppliers,products,ro})=>{
  const [open,setOpen]=useState(false);
  const [selSup,setSelSup]=useState('');

  const [detail,setDetail]=useState(null);

  const addItem=()=>setItems(p=>[...p,{productId:'',quantity:'1',unitPrice:'0',unit:''}]);
  const updItem=(i,k,v)=>setItems(p=>p.map((x,j)=>{
    if(j!==i)return x;
    const u={...x,[k]:v};
    if(k==='productId'){const pr=products.find(p=>p.id===parseInt(v));if(pr){u.unit=pr.unit;u.unitPrice=String(pr.price);}}
    return u;
  }));
  const total=items.reduce((s,x)=>s+(parseFloat(x.quantity)||0)*(parseFloat(x.unitPrice)||0),0);
  const save=()=>{
    if(!selSup||!items.length)return;
    const it=items.map(x=>({productId:parseInt(x.productId),quantity:parseFloat(x.quantity),unitPrice:parseFloat(x.unitPrice),total:(parseFloat(x.quantity)||0)*(parseFloat(x.unitPrice)||0)}));
    setOrders(p=>[...p,{id:uid(),supplierId:parseInt(selSup),status:'Aguardando Aprovação',date:today(),items:it,total}]);
    setOpen(false);setSelSup('');setItems([]);

                    <div className="section-label" style={{marginBottom:'4px'}}>Produto</div>
                    <Sel value={item.productId} onChange={e=>updItem(idx,'productId',e.target.value)}>
                      <option value="">Selecionar...</option>
                      {products.map(p=><option key={p.id} value={p.id}>{p.description}</option>)}
                    </Sel>
                  </div>
                  <div>
                    <div className="section-label" style={{marginBottom:'4px'}}>Unidade</div>
                    <div className="glass-input" style={{display:'flex',alignItems:'center',height:'36px',color:'#8a6a55',fontSize:'.8rem'}}>{item.unit||'—'}</div>

/* ─── APROVAÇÃO ─── */
const Aprovacao=({orders,setOrders,suppliers,products,setPayables})=>{
  const pending=orders.filter(o=>o.status==='Aguardando Aprovação');
  const [appOrder,setAppOrder]=useState(null);
  const [inst,setInst]=useState('3');
  const [fdd,setFdd]=useState(today());

  const approve=()=>{
    const n=parseInt(inst)||1;
    const iv=appOrder.total/n;
    const supName=suppliers.find(s=>s.id===appOrder.supplierId)?.name||'';
    const ps=Array.from({length:n},(_,i)=>({
      id:uid()+i,orderId:appOrder.id,supplierId:appOrder.supplierId,supplierName:supName,
      total:appOrder.total,installment:i+1,totalInstallments:n,
      value:i===n-1?appOrder.total-iv*(n-1):parseFloat(iv.toFixed(2)),
      dueDate:addDays(fdd,i*30),status:'Pendente',
    }));
    setPayables(p=>[...p,...ps]);
    setOrders(p=>p.map(o=>o.id===appOrder.id?{...o,status:'Aprovado'}:o));
    setAppOrder(null);
  };
  const reject=id=>setOrders(p=>p.map(o=>o.id===id?{...o,status:'Recusado'}:o));

  return(
    <div className="fade-in">
      <div style={{marginBottom:'1.5rem'}}>
        <h1 style={{fontFamily:"'Bebas Neue',cursive",fontSize:'2.2rem',color:'#d4a853',letterSpacing:'.08em'}}>Aprovação de Pedidos</h1>
        <p className="section-label" style={{marginTop:'3px'}}>{pending.length} pedido{pending.length!==1?'s':''} aguardando</p>
      </div>

      <Modal open={!!appOrder} onClose={()=>setAppOrder(null)} title="CONFIRMAR APROVAÇÃO">
        {appOrder&&<>
          <div style={{background:'rgba(212,168,83,.07)',border:'1px solid rgba(212,168,83,.2)',borderRadius:'8px',padding:'.85rem 1rem',marginBottom:'1rem'}}>

/* ─── CONTAS A PAGAR ─── */
const ContasPagar=({payables,setPayables,suppliers,ro})=>{
  const [filter,setFilter]=useState('Todos');
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState({supplierId:'',desc:'',total:'',inst:'1',fdd:today()});
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const t=today();
  const getS=p=>p.status==='Pago'?'Pago':isOver(p.dueDate)?'Vencido':'Pendente';
  const filtered=payables.filter(p=>filter==='Todos'||getS(p)===filter);
  const markPaid=id=>setPayables(p=>p.map(x=>x.id===id?{...x,status:'Pago',paidAt:t}:x));
  const totPend=payables.filter(p=>p.status!=='Pago').reduce((s,p)=>s+p.value,0);
  const totPaid=payables.filter(p=>p.status==='Pago').reduce((s,p)=>s+p.value,0);
  const totOver=payables.filter(p=>p.status!=='Pago'&&isOver(p.dueDate)).reduce((s,p)=>s+p.value,0);

  const save=()=>{
    const n=parseInt(form.inst)||1;
    const tot=parseFloat(form.total)||0;
    const iv=tot/n;
    const sn=suppliers.find(s=>s.id===parseInt(form.supplierId))?.name||form.desc||'Manual';
    const ps=Array.from({length:n},(_,i)=>({
      id:uid()+i,orderId:null,supplierId:parseInt(form.supplierId)||null,supplierName:sn,description:form.desc,
      total:tot,installment:i+1,totalInstallments:n,
      value:i===n-1?tot-iv*(n-1):parseFloat(iv.toFixed(2)),
      dueDate:addDays(form.fdd,i*30),status:'Pendente',
    }));
    setPayables(p=>[...p,...ps]);
    setForm({supplierId:'',desc:'',total:'',inst:'1',fdd:today()});
    setOpen(false);
  };

  return(
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'1.5rem',gap:'1rem',flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontFamily:"'Bebas Neue',cursive",fontSize:'2.2rem',color:'#d4a853',letterSpacing:'.08em'}}>Contas a Pagar</h1>
          <p className="section-label" style={{marginTop:'3px'}}>{payables.length} parcela{payables.length!==1?'s':''}</p>
        </div>
        {!ro&&<button className="btn-gold" onClick={()=>setOpen(true)}>+ Lançamento Manual</button>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem',marginBottom:'1.25rem'}}>
        {[{l:'A Pagar',v:totPend,c:'#fbbf24'},{l:'Pago',v:totPaid,c:'#4ade80'},{l:'Vencido',v:totOver,c:'#f87171'}].map((x,i)=>(
          <div key={i} className="glass-card" style={{padding:'1rem',textAlign:'center'}}>
            <div className="section-label" style={{marginBottom:'4px'}}>{x.l}</div>
            <div style={{fontFamily:"'Bebas Neue',cursive",fontSize:'1.35rem',color:x.c}}>{fmtCur(x.v)}</div>
          </div>
        ))}
      </div>

      <Modal open={open} onClose={()=>setOpen(false)} title="LANÇAMENTO MANUAL — CONTAS A PAGAR">
        <Field label="Fornecedor">
          <Sel value={form.supplierId} onChange={f('supplierId')}>
            <option value="">Selecionar...</option>
            {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </Sel>
        </Field>
        <Field label="Descrição / Referência"><Inp value={form.desc} onChange={f('desc')} placeholder="Ex: Despesa operacional"/></Field>
        <Field label="Valor Total (R$)"><Inp type="number" value={form.total} onChange={f('total')} min="0" step="0.01" placeholder="0,00"/></Field>
        <div style={{display:'flex',gap:'1rem',flexWrap:'wrap'}}>
          <Field label="Nº de Parcelas" half><Inp type="number" value={form.inst} onChange={f('inst')} min="1" max="60"/></Field>
          <Field label="1º Vencimento" half><Inp type="date" value={form.fdd} onChange={f('fdd')}/></Field>
        </div>
        {form.total&&parseInt(form.inst)>0&&<div style={{background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.2)',borderRadius:'8px',padding:'.6rem .85rem',marginBottom:'.5rem'}}>
          <span style={{color:'#fbbf24',fontSize:'.82rem'}}>{form.inst}× de {fmtCur(parseFloat(form.total)/parseInt(form.inst))} · 1ª: {fmtDate(form.fdd)}</span>
        </div>}
        <div style={{display:'flex',justifyContent:'flex-end',gap:'.6rem',marginTop:'.5rem'}}>
          <button className="btn-outline" onClick={()=>setOpen(false)}>Cancelar</button>
          <button className="btn-gold" onClick={save}>Gerar Parcelas</button>
        </div>
      </Modal>

      <FilterBar options={['Todos','Pendente','Pago','Vencido']} value={filter} onChange={setFilter}/>
      <div className="glass-card" style={{overflow:'hidden'}}>
        {filtered.length===0?<Empty msg="Nenhuma conta para este filtro."/>:(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:'1px solid rgba(212,168,83,.18)'}}><Th>Fornecedor</Th><Th>Parcela</Th><Th>Valor</Th><Th>Vencimento</Th><Th>Status</Th><Th></Th></tr></thead>
              <tbody>
                {filtered.map(p=>{
                  const s=getS(p);
                  return(
                    <tr key={p.id} className="table-row">
                      <Td>{p.supplierName||suppliers.find(x=>x.id===p.supplierId)?.name||p.description||'—'}</Td>
                      <Td muted>{p.installment}/{p.totalInstallments}</Td>
                      <Td gold>{fmtCur(p.value)}</Td>
                      <td style={{padding:'.7rem 1rem',color:s==='Vencido'?'#f87171':'#8a6a55',fontSize:'.85rem'}}>{fmtDate(p.dueDate)}</td>
                      <td style={{padding:'.7rem 1rem'}}><Badge s={s}/></td>
                      <td style={{padding:'.7rem 1rem',textAlign:'right'}}>
                        {!ro&&s!=='Pago'?<button className="btn-success btn-sm" onClick={()=>markPaid(p.id)}>✓ Marcar Pago</button>:s==='Pago'?<span style={{color:'#4ade80',fontSize:'.75rem'}}>✓ {fmtDate(p.paidAt)}</span>:null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
};

/* ─── CLIENTES ─── */
const Clientes=({clients,setClients,ro})=>{
  const blank={name:'',address:'',phone:'',cpf:''};
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState(blank);
  const [eid,setEid]=useState(null);
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));

    if(!form.name)return;
    if(eid){setClients(p=>p.map(c=>c.id===eid?{...c,...form}:c));setEid(null);}

          <h1 style={{fontFamily:"'Bebas Neue',cursive",fontSize:'2.2rem',color:'#d4a853',letterSpacing:'.08em'}}>Clientes</h1>

          <button className="btn-outline" onClick={()=>setOpen(false)}>Cancelar</button>
          <button className="btn-gold" onClick={save}>{eid?'Salvar':'Cadastrar'}</button>
        </div>
      </Modal>
      <div className="glass-card" style={{overflow:'hidden'}}>
        {clients.length===0?<Empty msg="Nenhum cliente cadastrado."/>:(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:'1px solid rgba(212,168,83,.18)'}}><Th>Nome</Th><Th>CPF</Th><Th>Celular</Th><Th>Endereço</Th><Th></Th></tr></thead>
              <tbody>
                {clients.map(c=>(
                  <tr key={c.id} className="table-row">
                    <Td>{c.name}</Td>
                    <Td muted>{c.cpf||'—'}</Td>
                    <Td muted>{c.phone||'—'}</Td>
                    <Td muted>{c.address||'—'}</Td>
                    <td style={{padding:'.7rem 1rem',textAlign:'right'}}>
                      {!ro&&<div style={{display:'flex',gap:'.4rem',justifyContent:'flex-end'}}>
                        <button className="btn-outline btn-sm" onClick={()=>edit(c)}><Ic n="edit" s={13}/></button>
                        <button className="btn-danger btn-sm" onClick={()=>setClients(p=>p.filter(x=>x.id!==c.id))}><Ic n="trash" s={13}/></button>

/* ─── CONTAS A RECEBER / COBRANÇAS ─── */
const ContasReceber=({receivables,setReceivables,clients,ro})=>{
  const [filter,setFilter]=useState('Todos');
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState({clientId:'',total:'',inst:'1',fdd:today(),pm:'Pix'});
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const t=today();
  const pms=['Pix','Dinheiro','Cheque','Boleto'];
  const pmIcon={Pix:'⚡',Dinheiro:'💵',Cheque:'📝',Boleto:'🏦'};
  const getS=r=>r.status==='Recebido'?'Recebido':isOver(r.dueDate)?'Vencido':'Pendente';
  const filtered=receivables.filter(r=>filter==='Todos'||getS(r)===filter);
  const markRec=id=>setReceivables(p=>p.map(x=>x.id===id?{...x,status:'Recebido',receivedAt:t}:x));
  const totPend=receivables.filter(r=>r.status!=='Recebido').reduce((s,r)=>s+r.value,0);
  const totRec=receivables.filter(r=>r.status==='Recebido').reduce((s,r)=>s+r.value,0);
  const totOver=receivables.filter(r=>r.status!=='Recebido'&&isOver(r.dueDate)).reduce((s,r)=>s+r.value,0);

  const save=()=>{
    if(!form.clientId||!form.total)return;
    const n=parseInt(form.inst)||1;
    const tot=parseFloat(form.total)||0;
    const iv=tot/n;
    const cl=clients.find(c=>c.id===parseInt(form.clientId));
    const rs=Array.from({length:n},(_,i)=>({
      id:uid()+i,clientId:parseInt(form.clientId),clientName:cl?.name||'',
      total:tot,installment:i+1,totalInstallments:n,
      value:i===n-1?tot-iv*(n-1):parseFloat(iv.toFixed(2)),
      dueDate:addDays(form.fdd,i*30),paymentMethod:form.pm,status:'Pendente',
    }));
    setReceivables(p=>[...p,...rs]);
    setForm({clientId:'',total:'',inst:'1',fdd:today(),pm:'Pix'});
    setOpen(false);
  };

  return(
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'1.5rem',gap:'1rem',flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontFamily:"'Bebas Neue',cursive",fontSize:'2.2rem',color:'#d4a853',letterSpacing:'.08em'}}>Cobranças & Contas a Receber</h1>
          <p className="section-label" style={{marginTop:'3px'}}>{receivables.length} parcela{receivables.length!==1?'s':''} lançada{receivables.length!==1?'s':''}</p>
        </div>
        {!ro&&<button className="btn-gold" onClick={()=>setOpen(true)}>+ Nova Cobrança</button>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem',marginBottom:'1.25rem'}}>
        {[{l:'A Receber',v:totPend,c:'#4ade80'},{l:'Recebido',v:totRec,c:'#d4a853'},{l:'Vencido',v:totOver,c:'#f87171'}].map((x,i)=>(
          <div key={i} className="glass-card" style={{padding:'1rem',textAlign:'center'}}>
            <div className="section-label" style={{marginBottom:'4px'}}>{x.l}</div>
            <div style={{fontFamily:"'Bebas Neue',cursive",fontSize:'1.35rem',color:x.c}}>{fmtCur(x.v)}</div>
          </div>
        ))}
      </div>

      <Modal open={open} onClose={()=>setOpen(false)} title="NOVA COBRANÇA">
        <Field label="Cliente *">
          <Sel value={form.clientId} onChange={f('clientId')}>
            <option value="">Selecionar cliente...</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </Sel>
        </Field>
        <Field label="Valor Total da Venda (R$) *"><Inp type="number" value={form.total} onChange={f('total')} placeholder="0,00" min="0" step="0.01"/></Field>
        <div style={{display:'flex',gap:'1rem',flexWrap:'wrap'}}>
          <Field label="Nº de Parcelas" half><Inp type="number" value={form.inst} onChange={f('inst')} min="1" max="60"/></Field>
          <Field label="1ª Parcela" half><Inp type="date" value={form.fdd} onChange={f('fdd')}/></Field>
        </div>
        <Field label="Forma de Pagamento">
          <Sel value={form.pm} onChange={f('pm')}>{pms.map(m=><option key={m} value={m}>{pmIcon[m]} {m}</option>)}</Sel>
        </Field>
        {form.total&&parseInt(form.inst)>0&&<div style={{background:'rgba(74,222,128,.06)',border:'1px solid rgba(74,222,128,.2)',borderRadius:'8px',padding:'.6rem .85rem',marginBottom:'.5rem'}}>
          <span style={{color:'#4ade80',fontSize:'.82rem'}}>{form.inst}× de {fmtCur(parseFloat(form.total)/parseInt(form.inst))} via {form.pm} · 1ª: {fmtDate(form.fdd)}</span>
        </div>}
        <div style={{display:'flex',justifyContent:'flex-end',gap:'.6rem',marginTop:'.5rem'}}>
          <button className="btn-outline" onClick={()=>setOpen(false)}>Cancelar</button>
          <button className="btn-gold" onClick={save} disabled={!form.clientId||!form.total}>Emitir Cobrança</button>
        </div>
      </Modal>

      <FilterBar options={['Todos','Pendente','Recebido','Vencido']} value={filter} onChange={setFilter}/>
      <div className="glass-card" style={{overflow:'hidden'}}>
        {filtered.length===0?<Empty msg="Nenhuma cobrança para este filtro."/>:(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:'1px solid rgba(212,168,83,.18)'}}><Th>Cliente</Th><Th>Parcela</Th><Th>Valor</Th><Th>Vencimento</Th><Th>Pagamento</Th><Th>Status</Th><Th></Th></tr></thead>
              <tbody>
                {filtered.map(r=>{
                  const s=getS(r);
                  return(
                    <tr key={r.id} className="table-row">
                      <Td>{r.clientName}</Td>
                      <Td muted>{r.installment}/{r.totalInstallments}</Td>
                      <Td green>{fmtCur(r.value)}</Td>
                      <td style={{padding:'.7rem 1rem',color:s==='Vencido'?'#f87171':'#8a6a55',fontSize:'.85rem'}}>{fmtDate(r.dueDate)}</td>
                      <Td muted>{pmIcon[r.paymentMethod]||''} {r.paymentMethod}</Td>
                      <td style={{padding:'.7rem 1rem'}}><Badge s={s}/></td>
                      <td style={{padding:'.7rem 1rem',textAlign:'right'}}>
                        {!ro&&s!=='Recebido'?<button className="btn-success btn-sm" onClick={()=>markRec(r.id)}>✓ Recebido</button>:s==='Recebido'?<span style={{color:'#4ade80',fontSize:'.75rem'}}>✓</span>:null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
};

  const [orders,setOrders]=useState(ORDERS);
  const [clients,setClients]=useState(CLIENTS);
  const [payables,setPayables]=useState(PAYABLES);
  const [receivables,setReceivables]=useState(RECEIVABLES);

  const ro=role==='Marceneiro';
  const pendApp=orders.filter(o=>o.status==='Aguardando Aprovação').length;

  const nav=[
    {id:'dashboard',label:'Dashboard',ic:'dashboard',roles:['Administrador','Financeiro','Marceneiro']},
    {id:'clientes',label:'Clientes',ic:'users',roles:['Administrador','Financeiro']},
    {id:'cobranças',label:'Cobranças / A Receber',ic:'trendUp',roles:['Administrador','Financeiro']},
    {id:'fornecedores',label:'Fornecedores',ic:'truck',roles:['Administrador','Financeiro']},
    {id:'produtos',label:'Produtos',ic:'box',roles:['Administrador','Financeiro']},
    {id:'pedidos',label:'Pedidos de Compra',ic:'clipboard',roles:['Administrador','Financeiro']},
    {id:'aprovacao',label:'Aprovação de Pedidos',ic:'check',roles:['Administrador'],badge:pendApp||null},
    {id:'contasPagar',label:'Contas a Pagar',ic:'receipt',roles:['Administrador','Financeiro']},
  ];
  const visNav=nav.filter(n=>n.roles.includes(role));

  useEffect(()=>{
    const avail=visNav.map(n=>n.id);
    if(!avail.includes(sec))setSec('dashboard');
  },[role]);

  const content={
    dashboard:<Dashboard suppliers={suppliers} products={products} orders={orders} clients={clients} payables={payables} receivables={receivables}/>,
    fornecedores:<Fornecedores suppliers={suppliers} setSuppliers={setSuppliers} ro={ro}/>,
    produtos:<Produtos products={products} setProducts={setProducts} suppliers={suppliers} ro={ro}/>,
    pedidos:<PedidosCompra orders={orders} setOrders={setOrders} suppliers={suppliers} products={products} ro={ro}/>,
    aprovacao:role==='Administrador'?<Aprovacao orders={orders} setOrders={setOrders} suppliers={suppliers} products={products} setPayables={setPayables}/>:<div className="glass-card" style={{padding:'3rem',textAlign:'center'}}><div style={{fontSize:'2.5rem',marginBottom:'.75rem'}}>🔒</div><p style={{color:'#f87171'}}>Acesso restrito ao Administrador.</p></div>,
    contasPagar:<ContasPagar payables={payables} setPayables={setPayables} suppliers={suppliers} ro={ro}/>,
    clientes:<Clientes clients={clients} setClients={setClients} ro={ro}/>,
    cobranças:<ContasReceber receivables={receivables} setReceivables={setReceivables} clients={clients} ro={ro}/>,
  };

  return(
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      {/* HEADER */}
      <header style={{background:'rgba(10,4,1,.92)',backdropFilter:'blur(24px)',borderBottom:'1px solid rgba(212,168,83,.22)',padding:'.7rem 1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:40,gap:'1rem'}}>
        <div style={{display:'flex',alignItems:'center',gap:'.85rem'}}>
          <button onClick={()=>setSidebar(p=>!p)} style={{background:'none',border:'none',cursor:'pointer',color:'#8a6a55',display:'flex',padding:'3px',borderRadius:'6px',transition:'color .15s'}}
            onMouseEnter={e=>e.currentTarget.style.color='#d4a853'} onMouseLeave={e=>e.currentTarget.style.color='#8a6a55'}>
            <Ic n="menu" s={19}/>
          </button>
          <Logo full={sidebar}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'1rem',flexWrap:'wrap'}}>
          {role==='Administrador'&&pendApp>0&&(
            <button onClick={()=>setSec('aprovacao')} style={{background:'rgba(212,168,83,.12)',border:'1px solid rgba(212,168,83,.38)',borderRadius:'9999px',padding:'.25rem .75rem',color:'#d4a853',fontSize:'.75rem',fontWeight:600,cursor:'pointer',fontFamily:'Raleway,sans-serif',display:'flex',alignItems:'center',gap:'.4rem'}}>
              <Ic n="clock" s={13}/> {pendApp} pedido{pendApp>1?'s':''} pendente{pendApp>1?'s':''}
            </button>
          )}
          <div style={{height:'16px',width:'1px',background:'rgba(212,168,83,.18)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
            <span className="section-label" style={{fontSize:'.6rem',whiteSpace:'nowrap'}}>Perfil ativo:</span>
            <div style={{display:'flex',gap:'.3rem'}}>
              {['Administrador','Financeiro','Marceneiro'].map(r=>(
                <button key={r} onClick={()=>setRole(r)} style={{padding:'.22rem .65rem',borderRadius:'9999px',fontSize:'.72rem',fontWeight:600,border:role===r?'1px solid #d4a853':'1px solid rgba(212,168,83,.18)',background:role===r?'rgba(212,168,83,.14)':'transparent',color:role===r?'#d4a853':'#8a6a55',cursor:'pointer',transition:'all .15s',fontFamily:'Raleway,sans-serif',whiteSpace:'nowrap'}}>{r}</button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* SIDEBAR */}
        <aside style={{width:sidebar?'232px':'0',minWidth:sidebar?'232px':'0',overflow:'hidden',background:'rgba(8,3,1,.72)',backdropFilter:'blur(20px)',borderRight:'1px solid rgba(212,168,83,.13)',padding:sidebar?'1.25rem .65rem':'0',transition:'all .28s ease',display:'flex',flexDirection:'column',gap:'2px'}}>
          <div className="section-label" style={{marginBottom:'.65rem',paddingLeft:'.35rem',whiteSpace:'nowrap'}}>MENU PRINCIPAL</div>
          {visNav.map(n=>(
            <div key={n.id} className={`sidebar-item${sec===n.id?' active':''}`} onClick={()=>setSec(n.id)}>
              <Ic n={n.ic} s={16} c="flex-shrink-0"/>
              <span style={{whiteSpace:'nowrap',flex:1}}>{n.label}</span>
              {n.badge&&<span style={{background:'#d4a853',color:'#150c09',borderRadius:'9999px',fontSize:'.62rem',fontWeight:700,padding:'1px 6px',minWidth:'18px',textAlign:'center'}}>{n.badge}</span>}
            </div>
          ))}
          <div style={{marginTop:'auto',paddingTop:'1.25rem'}}>
            <div className="divider-gold"/>
            <div style={{color:'#8a6a55',fontSize:'.68rem',textAlign:'center',padding:'.4rem',whiteSpace:'nowrap'}}>
              GARBO Movelaria · v1.0<br/>
              <span style={{color:'rgba(138,106,85,.5)',fontSize:'.62rem'}}>Sistema Financeiro</span>
            </div>
          </div>
        </aside>

        {/* MAIN */}
        <main className="scrollable" style={{flex:1,padding:'1.75rem 2rem',overflowY:'auto',maxHeight:'calc(100vh - 54px)'}}>
          {content[sec]||content['dashboard']}
        </main>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
